<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Event Registration</h1>

        <form onsubmit="showMessage(event)">

            <input type="text" placeholder="Enter your Name" required><br><br>

            <input type="text" placeholder="College Name" required><br><br>

            <input type="text" placeholder="Department" required><br><br>

            <select required>
                <option value="">Select Year</option>
                <option>1st Year</option>
                <option>2nd Year</option>
                <option>3rd Year</option>
                <option>4th Year</option>
            </select><br><br>

            <input type="email" placeholder="Email ID" required><br><br>

            <input type="tel" placeholder="Phone Number" required><br><br>

            <button type="submit">Submit</button>

        </form>

        <br>

        <a href="index.html">
            <button>Back to Home</button>
        </a>
    </div>

    <script src="script.js"></script>

</body>

</html>
